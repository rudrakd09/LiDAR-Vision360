[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-vision360-perception"
version = "0.1.0"
description = "Perception engine for the LiDAR-Vision360 project (simulation, filtering, clustering, tracking, collision/clearance analysis)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
viz = ["matplotlib>=3.8"]  # only required for preprocessing.visualize (raw-vs-processed debug plot)

# src-layout: each phase's subsystem (models, preprocessing, coordinates, clustering, objects,
# tracking, mapping, collision, clearance, pipeline, datasources, common) is its own top-level
# importable package under src/, per PROJECT_SPECIFICATION.md's repository architecture.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
