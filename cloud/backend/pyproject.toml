[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-vision360-backend"
version = "0.1.0"
description = "Local cloud backend for LiDAR-Vision360: ingests the same structured Python perception stream Unity consumes, persists events, and serves a REST + WebSocket API for the dashboard."
readme = "README.md"
requires-python = ">=3.10"
# Deliberately no formal dependency on `perception` here (not published to an index) -- same
# convention `simulator/pyproject.toml` already established: it imports perception's `streaming`/
# `common` packages directly and expects `perception` to already be installed (editable) in the
# same environment. See ../../README.md "Quickstart" for install order.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]
postgres = ["psycopg2-binary>=2.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
